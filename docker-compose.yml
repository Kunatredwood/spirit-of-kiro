networks:
  # This special network is configured so that the local metadata
  # service can bind to the specific IP address that ECS uses
  # in production
  credentials_network:
    driver: bridge
    ipam:
      config:
        - subnet: "169.254.170.0/24"
          gateway: 169.254.170.1

services:
  # This container vends credentials to your containers
  ecs-local-endpoints:
    # The Amazon ECS Local Container Endpoints Docker Image
    image: amazon/amazon-ecs-local-container-endpoints
    volumes:
      # Mount /var/run so we can access docker.sock and talk to Docker
      #- /var/run:/var/run
      # Mount the shared configuration directory, used by the AWS CLI and AWS SDKs
      # On Windows, this directory can be found at "%UserProfile%\.aws"
      # In the endpoints image, $HOME is set to /home.
      - $HOME/.aws/:/home/.aws/
    environment:
      # You can change which AWS CLI Profile is used
      AWS_PROFILE: "default"
    networks:
      credentials_network:
        # This special IP address is recognized by the AWS SDKs and AWS CLI
        ipv4_address: "169.254.170.2"

  # Storage for game data
  dynamodb-local:
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath ./data"
    image: "amazon/dynamodb-local:latest"
    container_name: dynamodb-local
    ports:
      - "8000:8000"
    volumes:
      - "./docker/dynamodb:/home/dynamodblocal/data"
    working_dir: /home/dynamodblocal
    networks:
      credentials_network:
        ipv4_address: "169.254.170.3"

  # Hosts the item images generation service
  item-images:
    build:
      context: ./item-images
      dockerfile: Dockerfile
    container_name: item-images
    ports:
      - "3001:3001"
    depends_on:
      ecs-local-endpoints:
        condition: service_started
    volumes:
      # Persist generated images using named volume (visible at D:/podman-data/volume/spirit_of_kiro)
      - spirit_of_kiro:/app/images
    env_file:
      - .env  # Load credentials from .env if it exists
    environment:
      AWS_REGION: ${AWS_REGION:-us-west-2}
      PORT: 3001
      ENVIRONMENT: local
      # S3 and CloudFront configuration (set to 'local' for local file storage)
      S3_BUCKET_NAME: local
      CLOUDFRONT_DOMAIN: localhost
      # Redis configuration (optional for local dev)
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      # AWS credentials from .env file
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      # This ENV VAR enables credentials
      AWS_CONTAINER_CREDENTIALS_RELATIVE_URI: "/creds"
      # Enables V3 Metadata
      ECS_CONTAINER_METADATA_URI: "http://169.254.170.2/v3"
    networks:
      credentials_network:
        ipv4_address: "169.254.170.6"
    develop:
      watch:
        - action: sync+restart
          path: ./item-images
          target: /app
          ignore:
            - node_modules/
        - action: rebuild
          path: package.json

  # Hosts the backend WebSocket server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: server
    ports:
      - "8080:8080"
    depends_on:
      # We must wait for the DB to available
      dynamodb-local:
        condition: service_started
      ecs-local-endpoints:
        condition: service_started
      item-images:
        condition: service_started
    env_file:
      - dev.env
      - .env  # Load credentials from .env if it exists
    environment:
      AWS_REGION: ${AWS_REGION:-us-east-2}
      DYNAMODB_ENDPOINT: http://dynamodb-local:8000
      ITEM_IMAGES_SERVICE_URL: http://item-images:3001
      # AWS credentials from .env file
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      # This ENV VAR enables credentials
      # Set it to "/creds" or "/role/<role name>"
      AWS_CONTAINER_CREDENTIALS_RELATIVE_URI: "/creds"
      # Enables V3 Metadata
      ECS_CONTAINER_METADATA_URI: "http://169.254.170.2/v3"
    networks:
      credentials_network:
        ipv4_address: "169.254.170.4"
    develop:
      watch:
        - action: sync+restart
          path: ./server
          target: /app
          ignore:
            - node_modules/
        - action: rebuild
          path: package.json
    

  # Hosts the web server for the game client
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: client
    ports:
      - "5173:5173"
    depends_on:
      - server
    environment:
      VITE_WS_URL: http://localhost:8080/
    networks:
      credentials_network:
        ipv4_address: "169.254.170.5"
    develop:
      watch:
        - action: sync
          path: ./client
          target: /app
          ignore:
            - node_modules/
        - action: rebuild
          path: package.json

volumes:
  # Use existing named volume that points to D:/podman-data/volume/spirit_of_kiro
  spirit_of_kiro:
    external: true

